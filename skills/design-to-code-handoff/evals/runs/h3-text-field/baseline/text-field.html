<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text field states</title>
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="text-field.css">
</head>
<body class="demo">
  <h1 class="demo__title">Text field</h1>

  <main class="demo__grid">

    <section class="demo__state">
      <p class="demo__caption">State=Default</p>
      <div class="text-field text-field--default">
        <label class="text-field__label" for="f-default">Work email</label>
        <div class="text-field__control">
          <input class="text-field__input" id="f-default" type="email"
                 placeholder="name@company.com"
                 aria-describedby="h-default">
        </div>
        <p class="text-field__hint" id="h-default">We only use this for sign-in links.</p>
      </div>
    </section>

    <section class="demo__state">
      <p class="demo__caption">State=Focus</p>
      <div class="text-field text-field--focus">
        <label class="text-field__label" for="f-focus">Work email</label>
        <div class="text-field__control">
          <input class="text-field__input" id="f-focus" type="email"
                 value="dana@northwind.io"
                 aria-describedby="h-focus">
        </div>
        <p class="text-field__hint" id="h-focus">We only use this for sign-in links.</p>
      </div>
    </section>

    <section class="demo__state">
      <p class="demo__caption">State=Error</p>
      <div class="text-field text-field--error">
        <label class="text-field__label" for="f-error">Work email</label>
        <div class="text-field__control">
          <input class="text-field__input" id="f-error" type="email"
                 value="dana@northwind"
                 aria-invalid="true"
                 aria-describedby="m-error">
        </div>
        <p class="text-field__message" id="m-error">
          <svg class="text-field__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 4.5v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="11" r="0.9" fill="currentColor"/>
          </svg>
          <span>Enter a full email address, for example dana@northwind.io</span>
        </p>
      </div>
    </section>

    <section class="demo__state">
      <p class="demo__caption">State=Disabled</p>
      <div class="text-field text-field--disabled">
        <label class="text-field__label" for="f-disabled">Work email</label>
        <div class="text-field__control">
          <input class="text-field__input" id="f-disabled" type="email"
                 value="dana@northwind.io" disabled
                 aria-describedby="h-disabled">
        </div>
        <p class="text-field__hint" id="h-disabled">We only use this for sign-in links.</p>
      </div>
    </section>

  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routewise hero</title>
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/components.css">
  <link rel="stylesheet" href="hero.css">
</head>
<body>
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__copy">
      <p class="hero__eyebrow">Field service software</p>
      <h1 class="hero__headline" id="hero-title">Dispatch the right technician the first time</h1>
      <p class="hero__body">Routewise matches each job to the nearest technician with the right parts on the van, and tells your customer when to expect them.</p>
      <div class="hero__actions">
        <a class="btn btn--lg btn--primary btn--block" href="#demo">Book a demo</a>
        <a class="btn btn--lg btn--secondary btn--block" href="#pricing">See pricing</a>
      </div>
    </div>
    <div class="hero__media" aria-hidden="true"></div>
  </section>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing plan card: Pro</title>
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/components.css">
  <link rel="stylesheet" href="plan-card.css">
</head>
<body style="margin: 0; padding: 32px 16px; background-color: var(--color-bg-page); font-family: var(--font-sans);">

  <article class="plan-card-pro">
    <span class="badge">Most popular</span>

    <header class="header">
      <h2 class="plan-name">Pro</h2>
      <p class="price-row">
        <span class="price">$29</span>
        <span class="period">/ month</span>
      </p>
    </header>

    <hr class="divider">

    <ul class="features">
      <li class="feature-row">
        <svg class="icon icon-check" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M4 10 L8 14 L16 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="feature">Unlimited projects</span>
      </li>
      <li class="feature-row">
        <svg class="icon icon-check" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M4 10 L8 14 L16 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="feature">Priority support within 4 hours</span>
      </li>
      <li class="feature-row">
        <svg class="icon icon-check" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M4 10 L8 14 L16 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="feature">Export to CSV and PDF</span>
      </li>
    </ul>

    <button type="button" class="btn btn--primary btn--lg btn--block">Start 14-day trial</button>
  </article>

</body>
</html>

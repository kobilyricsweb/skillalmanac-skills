<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample page with two tables</title>
</head>
<body>
<h1>Sample page</h1>

<table>
  <caption>Quarterly orders by region</caption>
  <tr><th>Region</th><th>Q1</th><th>Q2</th></tr>
  <tr><td>North</td><td>120</td><td>135</td></tr>
  <tr><td>South</td><td>98</td><td>110</td></tr>
</table>

<p>Team roster follows.</p>

<table>
  <caption>Team roster</caption>
  <thead>
    <tr><th colspan="2">Name</th><th>Role</th></tr>
  </thead>
  <tbody>
    <tr><td>Ana</td><td>Lee</td><td>Editor</td></tr>
    <tr><td rowspan="2">Ben</td><td>Cruz</td><td>Writer</td></tr>
    <tr><td>Dana</td><td>Editor</td></tr>
  </tbody>
</table>
</body>
</html>

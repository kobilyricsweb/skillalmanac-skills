<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>Flowly</title>
<style>
body { font-family: Inter, sans-serif; font-size: 14px; line-height: 1.2; color: #777; background: #ffffff; }
.hero { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); text-align: center; padding: 37px 13px; width: 1100px; }
.hero h1 { font-size: 15px; color: #ffffff; background-clip: text; -webkit-background-clip: text; line-height: 1.6; }
h2 { font-size: 17px; font-weight: 300; }
h3 { font-size: 13px; font-weight: 500; }
p.lead { font-size: 11px; font-weight: 600; font-family: Poppins, sans-serif; }
.card { padding: 18px; margin: 22px; border-radius: 6px; box-shadow: 0 1px 2px #0003; transition: all 0.3s; }
.card.a { border-radius: 10px; box-shadow: 0 4px 6px #0003; text-align: center; }
.card.b { border-radius: 14px; box-shadow: 0 8px 16px #0003; text-align: center; }
.card.c { border-radius: 20px; box-shadow: 0 12px 24px #0003; text-align: center; }
.card.d { border-radius: 28px; box-shadow: 0 20px 40px #0003; text-align: center; }
.glass { backdrop-filter: blur(10px); background: #ffffff33; }
.glass2 { backdrop-filter: blur(20px); }
.glass3 { backdrop-filter: blur(4px); }
button { outline: none; height: 30px; background: #6a11cb; color: #ffffff; border: 0; }
a { color: #aaaaaa; text-align: center; }
.t { text-align: center; }
.u { text-align: center; }
.v { text-align: center; }
</style>
</head>
<body>
<section class="hero">
  <h1>Unlock the power of seamless workflows</h1>
  <p>Welcome to our next-generation platform.</p>
  <button>Get started</button>
</section>
<h3>Features</h3>
<ul>
  <li>🚀 Fast</li>
  <li>🔒 Secure</li>
  <li>✨ Smart</li>
</ul>
<form><input type="text" name="email"><button type="submit">Join</button></form>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up</title>
<style>
body { font-family: sans-serif; font-size: 16px; line-height: 1.5; color: #222222; background: #ffffff; margin: 0; padding: 24px; }
h1 { font-size: 28px; margin: 0 0 16px; }
label { display: block; margin-bottom: 4px; }
input { display: block; width: 100%; max-width: 360px; padding: 8px; margin-bottom: 16px; border: 1px solid #888888; outline: none; }
button { padding: 8px 16px; background: #0b5cad; color: #ffffff; border: 0; }
</style>
</head>
<body>
<h1>Create your account</h1>
<form>
  <label for="name">Name</label>
  <input id="name" type="text">
  <label for="email">Email</label>
  <input id="email" type="email">
  <button type="submit">Create account</button>
</form>
</body>
</html>

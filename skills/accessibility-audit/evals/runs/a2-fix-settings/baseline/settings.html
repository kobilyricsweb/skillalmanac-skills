<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings | Tallybird</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #f6f6f4; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  .card { background: #fff; border: 1px solid #dcdcd8; border-radius: 10px; padding: 24px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
  *:focus { outline: 0; }
  .link { color: #1558d6; cursor: pointer; text-decoration: underline; }
  .switch { width: 44px; height: 24px; border-radius: 12px; background: #b9b9b4; position: relative; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: #1558d6; }
  .switch.on::after { left: 22px; }
  .dropdown { position: relative; width: 200px; }
  .dropdown-value { border: 1px solid #8a8a85; border-radius: 6px; padding: 8px 12px; background: #fff; cursor: pointer; }
  .dropdown-list { display: none; position: absolute; top: 44px; left: 0; right: 0; background: #fff; border: 1px solid #8a8a85; border-radius: 6px; z-index: 5; }
  .dropdown.open .dropdown-list { display: block; }
  .dropdown-item { padding: 8px 12px; cursor: pointer; }
  .dropdown-item:hover { background: #eef3fd; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); }
  .overlay.open { display: block; }
  .modal { background: #fff; border-radius: 10px; max-width: 420px; margin: 15vh auto 0; padding: 24px; position: relative; }
  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .close { position: absolute; top: 12px; right: 16px; font-size: 22px; cursor: pointer; }
  .btn { border: 0; border-radius: 6px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
  .btn-danger { background: #b3261e; color: #fff; }
  .btn-plain { background: #e9e9e5; color: #1d1d1f; }
  .field { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #8a8a85; border-radius: 6px; font-size: 16px; margin: 12px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1d1d1f; color: #fff; padding: 10px 16px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Workspace settings</h1>

  <div class="card">
    <h2>Notifications</h2>
    <div class="row">
      <span>Email me a weekly summary</span>
      <div class="switch on" id="weekly" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="row">
      <span>Theme</span>
      <div class="dropdown" id="theme">
        <div class="dropdown-value" onclick="toggleDropdown()">System</div>
        <div class="dropdown-list">
          <div class="dropdown-item" onclick="pick('System')">System</div>
          <div class="dropdown-item" onclick="pick('Light')">Light</div>
          <div class="dropdown-item" onclick="pick('Dark')">Dark</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Danger zone</h2>
    <p>Deleting the workspace removes all 14 projects and cannot be undone.</p>
    <span class="link" onclick="openModal()">Delete this workspace</span>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-title">Delete workspace?</div>
    <p>Type the workspace name <b>tallybird-hq</b> to confirm.</p>
    <input class="field" id="confirm-name" placeholder="Workspace name">
    <button class="btn btn-danger" onclick="doDelete()">Delete workspace</button>
    <button class="btn btn-plain" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
  function toggleSwitch(el) { el.classList.toggle('on'); toast('Saved'); }
  function toggleDropdown() { document.getElementById('theme').classList.toggle('open'); }
  function pick(v) { document.querySelector('.dropdown-value').textContent = v; toggleDropdown(); toast('Theme set to ' + v); }
  function openModal() { document.getElementById('overlay').classList.add('open'); }
  function closeModal() { document.getElementById('overlay').classList.remove('open'); }
  function doDelete() {
    if (document.getElementById('confirm-name').value !== 'tallybird-hq') { document.getElementById('confirm-name').style.borderColor = '#b3261e'; return; }
    closeModal(); toast('Workspace scheduled for deletion');
  }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2500);
  }
</script>
</body>
</html>

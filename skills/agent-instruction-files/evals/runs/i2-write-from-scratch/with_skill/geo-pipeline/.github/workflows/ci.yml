name: ci
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make install
      - run: make lint
      - run: make dev-db
      - run: make test
      - name: generated code is up to date
        run: make gen && git diff --exit-code geo/generated

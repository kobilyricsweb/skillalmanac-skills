apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: registry.example.com/shop/checkout:latest
          ports:
            - containerPort: 8080
          env:
            - name: STRIPE_API_KEY
              value: "live-key-placeholder-value"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  type: LoadBalancer
  selector:
    app: checkout
  ports:
    - port: 80
      targetPort: 8080

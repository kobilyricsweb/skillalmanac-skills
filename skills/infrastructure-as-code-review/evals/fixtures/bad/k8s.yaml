apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: registry.example.com/api:latest
          env:
            - name: DB_PASSWORD
              value: "hunter2hunter2"
          securityContext:
            privileged: true
        - name: sidecar
          image: nginx
          resources:
            requests:
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: creds
stringData:
  token: abc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: too-much
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - "*"

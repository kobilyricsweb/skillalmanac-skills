<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <title>Harbour Night Market, Friday 12 June</title>
  <rect id="bg" x="0" y="0" width="1080" height="1350" fill="#111111"/>
  <text x="90" y="420" font-family="Arial, sans-serif" font-size="120" font-weight="700" fill="#FFFFFF">NIGHT MARKET</text>
  <text x="90" y="520" font-family="Arial, sans-serif" font-size="48" fill="#FFFFFF">Food, music and 60 stalls</text>
  <text x="90" y="1000" font-family="Arial, sans-serif" font-size="28" fill="#D0D0D0">Fri 12 June, 18:00 to 23:00, Harbour Square</text>
  <rect id="cta" x="90" y="1100" width="760" height="90" rx="12" fill="#FFD400"/>
